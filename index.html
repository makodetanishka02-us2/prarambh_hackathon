<!DOCTYPE html>
<html lang="en" data-script="latin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <title>ConVerse — Financial Scam Simulator & Awareness Engine</title>
  <meta name="description" content="Practice spotting financial scams before they cost you money. Realistic scam simulations, safety guides, and awareness tracking for India.">
  <meta name="theme-color" content="#25231F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ConVerse">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./public/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="./public/icons/icon-192.svg">

  <!-- Typography: Outfit + Multilingual Indian Regional Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Application Shell Root -->
  <div id="app">
    <!-- Top Header -->
    <header class="app-header" role="banner">
      <div class="header-container">
        <!-- Brand Logo & Title -->
        <a href="#dashboard" class="brand-link" aria-label="ConVerse Home">
          <div class="brand-logo-icon">CV</div>
          <div class="brand-text-group">
            <span class="brand-title" data-i18n="app_name">ConVerse</span>
            <span class="brand-tagline" data-i18n="app_tagline">Financial Scam Simulator</span>
          </div>
        </a>

        <!-- Desktop Navigation Bar -->
        <nav class="desktop-nav" aria-label="Primary Navigation">
          <a href="#dashboard" class="desktop-nav-link active" data-i18n="nav_home">Home</a>
          <a href="#simulator" class="desktop-nav-link" data-i18n="nav_simulator">Simulator</a>
          <a href="#safety-tips" class="desktop-nav-link" data-i18n="nav_safety_guides">Safety Guides</a>
          <a href="#progress" class="desktop-nav-link" data-i18n="nav_progress">Progress</a>
          <a href="#settings" class="desktop-nav-link" data-i18n="nav_settings">Settings</a>
        </nav>

        <!-- Header Actions: Language Switcher Trigger -->
        <div class="header-actions">
          <button type="button" id="header-lang-btn" class="lang-selector-trigger" aria-label="Switch Language / भाषा बदलें">
            <span>🌐</span>
            <span id="header-lang-label">English</span>
            <span style="font-size: 10px; opacity: 0.6;">▼</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Content Container (Managed by Router) -->
    <main id="main-content" class="app-main" role="main" tabindex="-1">
      <!-- Pages are dynamically rendered here -->
    </main>

    <!-- Mobile Bottom Navigation Bar (~360px up to 768px) -->
    <nav class="app-bottom-nav" aria-label="Mobile Navigation">
      <a href="#dashboard" class="bottom-nav-item active" id="nav-item-dashboard">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label" data-i18n="nav_home">Home</span>
      </a>
      <a href="#simulator" class="bottom-nav-item" id="nav-item-simulator">
        <span class="nav-icon" aria-hidden="true">🎮</span>
        <span class="nav-label" data-i18n="nav_simulator">Simulator</span>
      </a>
      <a href="#safety-tips" class="bottom-nav-item" id="nav-item-tips">
        <span class="nav-icon" aria-hidden="true">🛡️</span>
        <span class="nav-label" data-i18n="nav_safety_guides">Safety Guides</span>
      </a>
      <a href="#progress" class="bottom-nav-item" id="nav-item-progress">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label" data-i18n="nav_progress">Progress</span>
      </a>
      <a href="#settings" class="bottom-nav-item" id="nav-item-settings">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span class="nav-label" data-i18n="nav_settings">Settings</span>
      </a>
    </nav>
  </div>

  <!-- Main Bootstrap JS -->
  <script type="module" src="./src/app/app.js"></script>
</body>
</html>
